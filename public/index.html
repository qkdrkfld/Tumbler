<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>텀블러 공장 제조품질관리</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #19342d;
        background: #f2f6f3;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
      }

      .app-header {
        min-height: 76px;
        box-sizing: border-box;
        width: 100%;
        padding: 12px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        background: #fff;
        border-bottom: 1px solid #d8e3dc;
      }

      .brand-link,
      .header-actions,
      .header-actions nav {
        display: flex;
        align-items: center;
      }

      .brand-link {
        gap: 12px;
        color: inherit;
        font-size: 20px;
        font-weight: 750;
        text-decoration: none;
      }

      .brand-link img {
        width: 44px;
        height: 44px;
      }

      .header-actions {
        gap: 22px;
      }

      .header-actions nav {
        gap: 20px;
      }

      .header-actions a {
        color: #276447;
        font-weight: 650;
      }

      .header-user {
        color: #40584d;
        white-space: nowrap;
      }

      .logout-button {
        width: auto;
        margin: 0;
        padding: 9px 14px;
      }

      .yellow-notice {
        box-sizing: border-box;
        width: 100%;
        padding: 14px 32px;
        color: #624b0b;
        background: #fff3bf;
        border-bottom: 1px solid #ead98a;
        line-height: 1.5;
      }

      [hidden] {
        display: none !important;
      }

      .page-content {
        flex: 1;
        width: 100%;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .app-footer {
        padding: 18px 24px;
        color: #52665b;
        text-align: center;
        background: #fff;
        border-top: 1px solid #d8e3dc;
      }

      .login-box {
        width: min(100% - 40px, 420px);
        box-sizing: border-box;
        padding: 36px;
        border: 1px solid #d8e3dc;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 34px rgb(25 52 45 / 8%);
      }

      #app-screen {
        width: min(100%, 920px);
        box-sizing: border-box;
        padding: 24px;
        border-radius: 14px;
        background: #fff;
      }

      #app-screen h1 {
        margin-bottom: 0;
      }

      .screen-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      .screen-heading h1 {
        margin: 0;
      }

      .new-inspection-link {
        width: auto;
        margin: 0;
        padding: 12px 18px;
        text-decoration: none;
      }

      .inspection-form {
        max-width: 620px;
      }

      .home-date-field {
        max-width: 260px;
        margin: 20px 0;
      }

      .home-date-field input {
        box-sizing: border-box;
        width: 100%;
      }

      .home-summary-cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .home-summary-card {
        min-height: 105px;
        box-sizing: border-box;
        padding: 18px;
        border: 1px solid #d8e3dc;
        border-radius: 12px;
        background: #f7faf8;
        cursor: pointer;
        transition: border-color 120ms ease, background-color 120ms ease;
      }

      .home-summary-card:hover {
        border-color: #789987;
        background: #edf4ef;
      }

      .home-summary-card[aria-pressed="true"] {
        border: 3px solid #276447;
        padding: 16px;
        background: #e3f0e8;
      }

      .home-summary-card h2 {
        margin: 0 0 12px;
        color: #52665b;
        font-size: 15px;
      }

      .home-summary-card p {
        margin: 0;
        color: #19342d;
        font-size: 28px;
        font-weight: 750;
      }

      .home-summary-error {
        color: #a32626;
      }

      .home-inspection-list {
        display: grid;
        gap: 12px;
        margin-top: 20px;
      }

      .home-inspection-card {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 16px;
        align-items: center;
        padding: 12px;
        border: 1px solid #d8e3dc;
        border-radius: 12px;
        color: inherit;
        background: #fff;
        text-decoration: none;
      }

      .home-inspection-card:hover {
        border-color: #276447;
        background: #f7faf8;
      }

      .home-inspection-card img,
      .home-inspection-card-placeholder {
        width: 110px;
        height: 90px;
        border-radius: 8px;
        object-fit: cover;
        background: #f2f6f3;
      }

      .home-inspection-card-placeholder {
        display: grid;
        place-items: center;
        color: #52665b;
        font-size: 13px;
      }

      .home-inspection-card h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .home-inspection-card p {
        margin: 4px 0;
        color: #52665b;
      }

      .home-inspection-empty {
        margin: 20px 0 0;
        color: #52665b;
      }

      .inspection-form label {
        margin-top: 20px;
      }

      .inspection-form select,
      .inspection-form textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #b9c9c0;
        border-radius: 9px;
        font: inherit;
      }

      .inspection-form textarea {
        min-height: 110px;
        resize: vertical;
      }

      .inspection-form select:focus,
      .inspection-form textarea:focus {
        outline: 3px solid #b8d9c7;
        border-color: #39785a;
      }

      .weight-range {
        margin: 18px 0 0;
        color: #40584d;
        font-weight: 650;
      }

      .inspection-summary {
        margin: 0 0 24px;
        padding: 18px 20px;
        border-radius: 10px;
        background: #f2f6f3;
      }

      .inspection-summary h2 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      .inspection-summary p {
        margin: 4px 0;
      }

      .inspection-tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid #d8e3dc;
      }

      .inspection-tabs button {
        width: auto;
        margin: 0;
        border-radius: 9px 9px 0 0;
        color: #276447;
        background: #eaf1ec;
      }

      .inspection-tabs button[aria-selected="true"] {
        color: #fff;
        background: #276447;
      }

      .inspection-tab-panel {
        min-height: 100px;
        padding: 20px 4px;
      }

      .inspection-detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
        gap: 24px;
      }

      .detail-main-image {
        display: grid;
        min-height: 300px;
        place-items: center;
        overflow: hidden;
        border-radius: 10px;
        background: #f2f6f3;
      }

      .detail-main-image img {
        width: 100%;
        height: 100%;
        max-height: 440px;
        object-fit: contain;
      }

      .detail-thumbnails {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .detail-thumbnails button {
        width: 68px;
        height: 68px;
        margin: 0;
        padding: 3px;
        overflow: hidden;
        border: 2px solid transparent;
        background: #f2f6f3;
      }

      .detail-thumbnails button[aria-current="true"] {
        border-color: #276447;
      }

      .detail-thumbnails img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .detail-values {
        display: grid;
        gap: 12px;
        margin: 0;
      }

      .detail-values div {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 8px;
      }

      .detail-values dt {
        color: #52665b;
        font-weight: 650;
      }

      .detail-values dd {
        margin: 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .detail-edit {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid #d8e3dc;
      }

      .detail-edit select {
        box-sizing: border-box;
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #b9c9c0;
        border-radius: 9px;
        font: inherit;
      }

      .inspection-photo-input {
        display: block;
        margin-top: 8px;
      }

      .photo-previews {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      .photo-previews img {
        width: 92px;
        height: 92px;
        border: 1px solid #d8e3dc;
        border-radius: 8px;
        object-fit: cover;
      }

      #not-found-view p {
        margin: 0 0 18px;
      }

      #not-found-view a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 8px;
        color: #fff;
        background: #276447;
        font-weight: 700;
        text-decoration: none;
      }

      h1 {
        margin: 0 0 28px;
        font-size: 28px;
        line-height: 1.35;
      }

      label {
        display: block;
        margin: 18px 0 8px;
        font-weight: 650;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #b9c9c0;
        border-radius: 9px;
        font: inherit;
      }

      input:focus {
        outline: 3px solid #b8d9c7;
        border-color: #39785a;
      }

      button {
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        border: 0;
        border-radius: 9px;
        color: #fff;
        background: #276447;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .logout-button:disabled {
        cursor: not-allowed;
      }

      .error-message {
        margin: 16px 0 0;
        color: #b42318;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <a class="brand-link" href="/" data-link aria-label="텀블러 공장 제조품질관리 홈">
        <img src="/logo.svg" alt="" />
        <span>텀블러 공장 제조품질관리</span>
      </a>
      <div id="header-actions" class="header-actions" hidden>
        <nav aria-label="주요 메뉴">
          <a href="/settings" data-link>설정</a>
          <span id="header-user" class="header-user"></span>
        </nav>
        <button id="logout-button" class="logout-button" type="button">로그아웃</button>
      </div>
    </header>

    <aside id="yellow-notice" class="yellow-notice" hidden>
      AI 분석 결과는 보조 자료이며 품질 담당자의 확인이 필요합니다. 최종 출하 승인은 현장 기준에 따라 별도로 진행하세요.
    </aside>

    <div class="page-content">
      <main id="login-box" class="login-box">
        <h1>텀블러 공장 제조품질관리</h1>
        <form id="login-form">
          <label for="username">계정</label>
          <input id="username" name="username" value="writer" autocomplete="username" required />

          <label for="password">비밀번호</label>
          <input
            id="password"
            name="password"
            type="password"
            value="writer1234!"
            autocomplete="current-password"
            required
          />

          <button id="login-button" type="submit">로그인</button>
          <p id="login-error" class="error-message" role="alert" hidden></p>
        </form>
      </main>
      <main id="app-screen" hidden>
        <div class="screen-heading">
          <h1 id="screen-title">품질 현황</h1>
          <a id="new-inspection-link" class="new-inspection-link" href="/inspections/new" data-link hidden>사진 등록</a>
        </div>
        <section id="home-view" hidden>
          <label class="home-date-field" for="home-date">날짜
            <input id="home-date" type="date" />
          </label>
          <p id="home-summary-error" class="home-summary-error" role="alert" hidden></p>
          <div class="home-summary-cards" aria-live="polite">
            <button id="home-card-total" class="home-summary-card" type="button" aria-pressed="false"><h2>검사 건수</h2><p id="home-total">0</p></button>
            <button id="home-card-ng" class="home-summary-card" type="button" aria-pressed="false"><h2>NG 건수</h2><p id="home-ng">0</p></button>
            <button id="home-card-hold" class="home-summary-card" type="button" aria-pressed="false"><h2>HOLD 건수</h2><p id="home-hold">0</p></button>
            <button id="home-card-review-pending" class="home-summary-card" type="button" aria-pressed="false"><h2>보고서 검토 대기</h2><p id="home-review-pending">0</p></button>
          </div>
          <p id="home-inspection-message" class="home-inspection-empty" hidden></p>
          <div id="home-inspection-list" class="home-inspection-list"></div>
        </section>
        <section id="new-inspection-view" class="inspection-form" hidden>
          <label for="inspection-product">제품</label>
          <select id="inspection-product" name="product_id"></select>

          <label for="inspection-datetime">검사일시</label>
          <input id="inspection-datetime" name="inspected_at" type="datetime-local" step="1" />

          <label for="inspection-revision">검사기준</label>
          <select id="inspection-revision" name="revision">
            <option value="Rev.A">Rev.A</option>
            <option value="Rev.B">Rev.B</option>
          </select>

          <label for="inspection-weight">중량(g)</label>
          <input id="inspection-weight" name="weight_g" type="number" step="any" />

          <label for="inspection-memo">메모</label>
          <textarea id="inspection-memo" name="memo"></textarea>

          <p id="inspection-weight-range" class="weight-range" aria-live="polite"></p>

          <label for="inspection-photos">사진</label>
          <input id="inspection-photos" class="inspection-photo-input" name="images" type="file" accept="image/*" multiple />
          <div id="inspection-photo-previews" class="photo-previews" aria-live="polite"></div>
          <button id="inspection-submit-button" type="button">검사 등록</button>
          <p id="inspection-submit-error" class="error-message" role="alert" hidden></p>
        </section>
        <section id="settings-view" hidden>
          <article class="home-summary-card" aria-labelledby="storage-status-heading">
            <h2 id="storage-status-heading">저장소 상태</h2>
            <p id="storage-status">저장소 상태를 확인하고 있습니다.</p>
          </article>
        </section>
        <section id="inspection-detail-view" hidden>
          <div class="inspection-summary">
            <h2 id="detail-inspection-id"></h2>
            <p id="detail-product"></p>
            <p id="detail-decision"></p>
            <p id="detail-content-version"></p>
          </div>
          <div class="inspection-tabs" role="tablist" aria-label="검사 상세 탭">
            <button id="detail-tab-1" type="button" role="tab" aria-selected="true" aria-controls="detail-panel">① 사진·측정값</button>
            <button id="detail-tab-2" type="button" role="tab" aria-selected="false" aria-controls="detail-panel">② AI 결과 확인</button>
            <button id="detail-tab-3" type="button" role="tab" aria-selected="false" aria-controls="detail-panel">③ 검사기준과 비교하기</button>
            <button id="detail-tab-4" type="button" role="tab" aria-selected="false" aria-controls="detail-panel">④ 내 판단 기록</button>
          </div>
          <div id="detail-panel" class="inspection-tab-panel" role="tabpanel" aria-labelledby="detail-tab-1">
            <div id="detail-photo-measurement" class="inspection-detail-grid">
              <div>
                <div id="detail-main-image" class="detail-main-image"></div>
                <div id="detail-thumbnails" class="detail-thumbnails" aria-label="검사 사진"></div>
              </div>
              <div>
                <dl class="detail-values">
                  <div><dt>제품</dt><dd id="detail-value-product"></dd></div>
                  <div><dt>검사일시</dt><dd id="detail-value-date"></dd></div>
                  <div><dt>검사기준</dt><dd id="detail-value-revision"></dd></div>
                  <div><dt>중량</dt><dd id="detail-value-weight"></dd></div>
                  <div><dt>메모</dt><dd id="detail-value-memo"></dd></div>
                </dl>
                <form id="detail-edit-form" class="detail-edit">
                  <label for="detail-edit-product">제품</label>
                  <select id="detail-edit-product" name="product_id"></select>
                  <label for="detail-edit-datetime">검사일시</label>
                  <input id="detail-edit-datetime" name="inspected_at" type="datetime-local" step="1" required />
                  <label for="detail-edit-weight">중량(g)</label>
                  <input id="detail-edit-weight" name="weight_g" type="number" step="any" />
                  <button id="detail-edit-save" type="submit">저장</button>
                  <p id="detail-edit-error" class="error-message" role="alert" hidden></p>
                </form>
              </div>
            </div>
          </div>
        </section>
        <section id="not-found-view" hidden>
          <p>페이지를 찾을 수 없습니다</p>
          <a href="/" data-link>홈으로 가기</a>
        </section>
      </main>
    </div>

    <footer id="app-footer" class="app-footer" hidden>텀블러 공장 품질관리 시스템입니다.</footer>

    <script>
      const loginBox = document.querySelector('#login-box');
      const loginForm = document.querySelector('#login-form');
      const loginButton = document.querySelector('#login-button');
      const logoutButton = document.querySelector('#logout-button');
      const loginError = document.querySelector('#login-error');
      const appScreen = document.querySelector('#app-screen');
      const headerActions = document.querySelector('#header-actions');
      const headerUser = document.querySelector('#header-user');
      const yellowNotice = document.querySelector('#yellow-notice');
      const appFooter = document.querySelector('#app-footer');
      const screenTitle = document.querySelector('#screen-title');
      const notFoundView = document.querySelector('#not-found-view');
      const newInspectionLink = document.querySelector('#new-inspection-link');
      const homeView = document.querySelector('#home-view');
      const homeDate = document.querySelector('#home-date');
      const homeSummaryError = document.querySelector('#home-summary-error');
      const homeTotal = document.querySelector('#home-total');
      const homeNg = document.querySelector('#home-ng');
      const homeHold = document.querySelector('#home-hold');
      const homeReviewPending = document.querySelector('#home-review-pending');
      const homeSummaryCards = Array.from(document.querySelectorAll('.home-summary-card'));
      const homeInspectionMessage = document.querySelector('#home-inspection-message');
      const homeInspectionList = document.querySelector('#home-inspection-list');
      const newInspectionView = document.querySelector('#new-inspection-view');
      const settingsView = document.querySelector('#settings-view');
      const storageStatus = document.querySelector('#storage-status');
      const inspectionProduct = document.querySelector('#inspection-product');
      const inspectionDatetime = document.querySelector('#inspection-datetime');
      const inspectionRevision = document.querySelector('#inspection-revision');
      const inspectionWeightRange = document.querySelector('#inspection-weight-range');
      const inspectionPhotos = document.querySelector('#inspection-photos');
      const inspectionPhotoPreviews = document.querySelector('#inspection-photo-previews');
      const inspectionWeight = document.querySelector('#inspection-weight');
      const inspectionMemo = document.querySelector('#inspection-memo');
      const inspectionSubmitButton = document.querySelector('#inspection-submit-button');
      const inspectionSubmitError = document.querySelector('#inspection-submit-error');
      const inspectionDetailView = document.querySelector('#inspection-detail-view');
      const detailInspectionId = document.querySelector('#detail-inspection-id');
      const detailProduct = document.querySelector('#detail-product');
      const detailDecision = document.querySelector('#detail-decision');
      const detailContentVersion = document.querySelector('#detail-content-version');
      const detailPanel = document.querySelector('#detail-panel');
      const detailTabs = Array.from(document.querySelectorAll('.inspection-tabs [role="tab"]'));
      const detailPhotoMeasurement = document.querySelector('#detail-photo-measurement');
      const detailMainImage = document.querySelector('#detail-main-image');
      const detailThumbnails = document.querySelector('#detail-thumbnails');
      const detailValueProduct = document.querySelector('#detail-value-product');
      const detailValueDate = document.querySelector('#detail-value-date');
      const detailValueRevision = document.querySelector('#detail-value-revision');
      const detailValueWeight = document.querySelector('#detail-value-weight');
      const detailValueMemo = document.querySelector('#detail-value-memo');
      const detailEditForm = document.querySelector('#detail-edit-form');
      const detailEditProduct = document.querySelector('#detail-edit-product');
      const detailEditDatetime = document.querySelector('#detail-edit-datetime');
      const detailEditWeight = document.querySelector('#detail-edit-weight');
      const detailEditSave = document.querySelector('#detail-edit-save');
      const detailEditError = document.querySelector('#detail-edit-error');
      const roleLabels = { writer: '작성자', reviewer: '검토자', 'factory-user': '품질관리' };
      let products = [];
      const standards = {};
      let currentInspection = null;
      let activeDetailImageIndex = 0;
      let hasLoadedHomeDate = false;
      let homeRequestId = 0;
      let homeListRequestId = 0;
      let activeHomeFilter = null;

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.addEventListener('load', () => resolve(reader.result));
          reader.addEventListener('error', () => reject(new Error('사진을 읽지 못했습니다.')));
          reader.readAsDataURL(file);
        });
      }

      inspectionPhotos.addEventListener('change', async () => {
        inspectionPhotoPreviews.replaceChildren();
        for (const file of inspectionPhotos.files) {
          try {
            const dataUrl = await readFileAsDataUrl(file);
            const image = document.createElement('img');
            image.src = dataUrl;
            image.alt = file.name;
            inspectionPhotoPreviews.append(image);
          } catch (error) {
            inspectionPhotoPreviews.textContent = error.message || '사진을 읽지 못했습니다.';
            break;
          }
        }
      });

      function formatLocalDateTime(date) {
        const localDate = new Date(date.getTime() - date.getTimezoneOffset() * 60_000);
        return localDate.toISOString().slice(0, 19);
      }

      function formatApiDateTime(value) {
        return value ? `${value.replace('T', ' ')}:00`.replace(/:(\d{2}):(\d{2}):00$/, ':$1:$2') : '';
      }

      async function loadProducts() {
        const response = await fetch('/api/products');
        const result = await response.json();
        if (!response.ok || result.error) throw new Error(result.error || '제품 목록을 불러오지 못했습니다.');
        products = result;
        inspectionProduct.replaceChildren(...products.map((product) => {
          const option = document.createElement('option');
          option.value = product.product_id;
          option.textContent = product.label;
          return option;
        }));
      }

      async function loadStandard(revision) {
        if (!standards[revision]) {
          const response = await fetch(`/api/standards/${encodeURIComponent(revision)}`);
          const result = await response.json();
          if (!response.ok || result.error) throw new Error(result.error || '검사기준을 불러오지 못했습니다.');
          standards[revision] = result;
        }
        const productId = inspectionProduct.value;
        const range = standards[revision].weight_g[productId];
        inspectionWeightRange.textContent = range ? `기준 중량: ${range.min}~${range.max}g` : '';
      }

      async function prepareNewInspection() {
        if (!products.length) await loadProducts();
        inspectionDatetime.value = formatLocalDateTime(new Date());
        inspectionRevision.value = 'Rev.A';
        await loadStandard(inspectionRevision.value);
      }

      async function renderInspectionDetail(inspectionId) {
        if (!products.length) await loadProducts();
        const response = await fetch(`/api/inspections/${encodeURIComponent(inspectionId)}`);
        const result = await response.json();
        if (!response.ok || result.error) {
          throw new Error(result.error || '검사를 불러오지 못했습니다.');
        }
        currentInspection = result;
        detailInspectionId.textContent = result.inspection_id;
        const product = products.find((item) => item.product_id === result.product_id);
        detailProduct.textContent = `제품: ${product?.name || result.product_id}`;
        detailDecision.textContent = `판정: ${result.decision || '미판정'}`;
        detailContentVersion.textContent = `검사 기록 버전: ${result.content_version}`;
        detailValueProduct.textContent = product?.name || result.product_id;
        detailValueDate.textContent = result.inspected_at;
        detailValueRevision.textContent = result.revision;
        detailValueWeight.textContent = result.weight_g === null ? '미측정' : `${result.weight_g}g`;
        detailValueMemo.textContent = result.memo || '없음';
        detailEditProduct.replaceChildren(...products.map((item) => {
          const option = document.createElement('option');
          option.value = item.product_id;
          option.textContent = item.label;
          return option;
        }));
        detailEditProduct.value = result.product_id;
        detailEditDatetime.value = result.inspected_at.replace(' ', 'T');
        detailEditWeight.value = result.weight_g === null ? '' : String(result.weight_g);
        detailEditError.hidden = true;
        renderDetailImages(result.images || []);
        selectDetailTab(0);
      }

      function renderDetailImages(images) {
        activeDetailImageIndex = 0;
        detailMainImage.replaceChildren();
        detailThumbnails.replaceChildren();
        if (!images.length) {
          detailMainImage.textContent = '등록된 사진이 없습니다.';
          return;
        }

        const showImage = (index) => {
          activeDetailImageIndex = index;
          const mainImage = document.createElement('img');
          mainImage.src = images[index];
          mainImage.alt = `검사 사진 ${index + 1}`;
          detailMainImage.replaceChildren(mainImage);
          Array.from(detailThumbnails.children).forEach((button, buttonIndex) => {
            button.setAttribute('aria-current', String(buttonIndex === index));
          });
        };

        images.forEach((imageUrl, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.setAttribute('aria-label', `검사 사진 ${index + 1} 크게 보기`);
          button.setAttribute('aria-current', String(index === activeDetailImageIndex));
          const thumbnail = document.createElement('img');
          thumbnail.src = imageUrl;
          thumbnail.alt = '';
          button.append(thumbnail);
          button.addEventListener('click', () => showImage(index));
          detailThumbnails.append(button);
        });
        showImage(0);
      }

      function selectDetailTab(index) {
        detailTabs.forEach((tab, tabIndex) => {
          const selected = tabIndex === index;
          tab.setAttribute('aria-selected', String(selected));
          tab.tabIndex = selected ? 0 : -1;
        });
        detailPanel.setAttribute('aria-labelledby', detailTabs[index].id);
        if (index === 0) {
          detailPhotoMeasurement.hidden = false;
          detailPanel.textContent = '';
          detailPanel.append(detailPhotoMeasurement);
        } else {
          detailPhotoMeasurement.hidden = true;
          const placeholder = document.createElement('p');
          placeholder.textContent = '이 탭은 나중 회차에서 만듭니다.';
          detailPanel.replaceChildren(placeholder);
        }
      }

      async function loadHomeSummary(useSelectedDate = false) {
        const requestId = ++homeRequestId;
        homeSummaryError.hidden = true;
        const query = useSelectedDate && homeDate.value
          ? `?date=${encodeURIComponent(homeDate.value)}`
          : '';
        try {
          const response = await fetch(`/api/home${query}`);
          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result.error || '하루 현황을 불러오지 못했습니다.');
          }
          if (requestId !== homeRequestId) return;
          if (!useSelectedDate && result.date) homeDate.value = result.date;
          homeTotal.textContent = String(result.total);
          homeNg.textContent = String(result.ng);
          homeHold.textContent = String(result.hold);
          homeReviewPending.textContent = String(result.review_pending);
          await loadHomeInspections(result.date || homeDate.value);
        } catch (error) {
          if (requestId !== homeRequestId) return;
          homeSummaryError.textContent = error.message || '하루 현황을 불러오지 못했습니다.';
          homeSummaryError.hidden = false;
        }
      }

      async function loadStorageStatus() {
        storageStatus.textContent = '저장소 상태를 확인하고 있습니다.';
        try {
          const response = await fetch('/api/operations');
          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result.error || '저장소 상태를 불러오지 못했습니다.');
          }
          storageStatus.textContent = `저장소: ${result.label}`;
        } catch (error) {
          storageStatus.textContent = error.message || '저장소 상태를 불러오지 못했습니다.';
        }
      }

      async function loadHomeInspections(date) {
        const requestId = ++homeListRequestId;
        homeInspectionList.replaceChildren();
        homeInspectionMessage.hidden = true;
        if (!date) {
          homeInspectionMessage.textContent = '이 날짜에 등록한 검사가 없습니다.';
          homeInspectionMessage.hidden = false;
          return;
        }

        try {
          const parameters = new URLSearchParams({ date });
          if (activeHomeFilter) parameters.set(activeHomeFilter.key, activeHomeFilter.value);
          const response = await fetch(`/api/inspections?${parameters}`);
          const inspections = await response.json();
          if (!response.ok || inspections.error) {
            throw new Error(inspections.error || '검사 목록을 불러오지 못했습니다.');
          }
          if (requestId !== homeListRequestId) return;
          if (!inspections.length) {
            homeInspectionMessage.textContent = activeHomeFilter
              ? '이 날짜에 이 종류의 검사가 없습니다.'
              : '이 날짜에 등록한 검사가 없습니다.';
            homeInspectionMessage.hidden = false;
            return;
          }

          const productsResponse = products.length
            ? null
            : await fetch('/api/products');
          if (productsResponse) {
            const productList = await productsResponse.json();
            if (!productsResponse.ok || productList.error) {
              throw new Error(productList.error || '제품 목록을 불러오지 못했습니다.');
            }
            products = productList;
          }
          if (requestId !== homeListRequestId) return;

          for (const inspection of inspections) {
            const product = products.find((item) => item.product_id === inspection.product_id);
            const link = document.createElement('a');
            link.className = 'home-inspection-card';
            link.href = `/inspections/${encodeURIComponent(inspection.inspection_id)}`;
            link.dataset.link = '';

            if (inspection.images?.[0]) {
              const image = document.createElement('img');
              image.src = inspection.images[0];
              image.alt = `${inspection.inspection_id} 첫 사진`;
              link.append(image);
            } else {
              const placeholder = document.createElement('span');
              placeholder.className = 'home-inspection-card-placeholder';
              placeholder.textContent = '사진 없음';
              link.append(placeholder);
            }

            const details = document.createElement('div');
            const heading = document.createElement('h3');
            heading.textContent = inspection.inspection_id;
            details.append(heading);
            const values = [
              `제품: ${product?.name || inspection.product_id}`,
              `중량: ${inspection.weight_g === null ? '미측정' : `${inspection.weight_g}g`}`,
              `판정: ${inspection.decision || '미판정'}`,
            ];
            for (const value of values) {
              const paragraph = document.createElement('p');
              paragraph.textContent = value;
              details.append(paragraph);
            }
            link.append(details);
            homeInspectionList.append(link);
          }
        } catch (error) {
          if (requestId !== homeListRequestId) return;
          homeInspectionMessage.textContent = error.message || '검사 목록을 불러오지 못했습니다.';
          homeInspectionMessage.hidden = false;
        }
      }

      function renderScreen() {
        const route = window.location.pathname;
        const isHome = route === '/';
        const isNewInspection = route === '/inspections/new';
        const isSettings = route === '/settings';
        const detailMatch = route.match(/^\/inspections\/([^/]+)$/);
        const isInspectionDetail = Boolean(detailMatch);
        let title = '품질 현황';
        if (route === '/inspections/new') title = '검사 등록';
        else if (/^\/inspections\/[^/]+$/.test(route)) title = '검사 상세';
        else if (route === '/settings') title = '설정';
        else if (route !== '/') {
          screenTitle.hidden = true;
          notFoundView.hidden = false;
          return;
        }
        screenTitle.textContent = title;
        screenTitle.hidden = false;
        notFoundView.hidden = true;
        homeView.hidden = !isHome;
        newInspectionView.hidden = !isNewInspection;
        settingsView.hidden = !isSettings;
        inspectionDetailView.hidden = !isInspectionDetail;
        newInspectionLink.hidden = !isHome;
        if (isNewInspection) {
          prepareNewInspection().catch((error) => {
            inspectionWeightRange.textContent = error.message || '제품과 검사기준을 불러오지 못했습니다.';
          });
        }
        if (isHome) {
          if (!hasLoadedHomeDate) {
            homeDate.value = '';
            hasLoadedHomeDate = true;
            loadHomeSummary(false);
          } else {
            loadHomeSummary(true);
          }
        }
        if (isSettings) loadStorageStatus();
        if (isInspectionDetail && detailMatch) {
          renderInspectionDetail(decodeURIComponent(detailMatch[1])).catch((error) => {
            detailPanel.textContent = error.message || '검사를 불러오지 못했습니다.';
          });
        }
      }

      function navigate(path) {
        if (window.location.pathname !== path) history.pushState({}, '', path);
        renderScreen();
      }

      function showApp(user) {
        loginBox.hidden = true;
        appScreen.hidden = false;
        headerActions.hidden = false;
        headerUser.textContent = `${user.username} (${roleLabels[user.role] || user.role})`;
        yellowNotice.hidden = false;
        appFooter.hidden = false;
        renderScreen();
      }

      function showLoginError(message) {
        loginError.textContent = message;
        loginError.hidden = false;
      }

      async function checkLogin() {
        try {
          const response = await fetch('/api/session');
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || '로그인 상태를 확인하지 못했습니다.');
          }
          if (result.user) showApp(result.user);
        } catch (error) {
          showLoginError(error.message || '로그인 상태를 확인하지 못했습니다.');
        }
      }

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginError.hidden = true;
        loginButton.disabled = true;

        const formData = new FormData(loginForm);
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: formData.get('username'),
              password: formData.get('password'),
            }),
          });
          const result = await response.json();
          if (!response.ok || result.error) {
            showLoginError(result.error || '로그인 정보를 확인하세요.');
            return;
          }
          showApp(result.user);
        } catch (error) {
          showLoginError(error.message || '서버와 통신할 수 없습니다.');
        } finally {
          loginButton.disabled = false;
        }
      });

      document.addEventListener('click', (event) => {
        const link = event.target.closest('a[data-link]');
        if (
          !link ||
          event.defaultPrevented ||
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        const target = new URL(link.href, window.location.href);
        if (target.origin !== window.location.origin) return;

        event.preventDefault();
        navigate(`${target.pathname}${target.search}${target.hash}`);
      });

      inspectionProduct.addEventListener('change', () => {
        loadStandard(inspectionRevision.value).catch((error) => {
          inspectionWeightRange.textContent = error.message || '검사기준을 불러오지 못했습니다.';
        });
      });
      inspectionRevision.addEventListener('change', () => {
        loadStandard(inspectionRevision.value).catch((error) => {
          inspectionWeightRange.textContent = error.message || '검사기준을 불러오지 못했습니다.';
        });
      });

      detailTabs.forEach((tab, index) => {
        tab.addEventListener('click', () => selectDetailTab(index));
      });

      homeDate.addEventListener('change', () => loadHomeSummary(true));

      homeSummaryCards.forEach((card, index) => {
        card.addEventListener('click', () => {
          if (index === 0 || card.getAttribute('aria-pressed') === 'true') {
            activeHomeFilter = null;
          } else if (index === 1) {
            activeHomeFilter = { key: 'decision', value: 'NG' };
          } else if (index === 2) {
            activeHomeFilter = { key: 'decision', value: 'HOLD' };
          } else {
            activeHomeFilter = { key: 'review', value: 'pending' };
          }
          homeSummaryCards.forEach((item) => {
            item.setAttribute('aria-pressed', String(item === card && activeHomeFilter !== null));
          });
          loadHomeInspections(homeDate.value);
        });
      });

      detailEditForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        detailEditError.hidden = true;
        if (!currentInspection) return;
        detailEditSave.disabled = true;
        try {
          const datetimeValue = detailEditDatetime.value;
          const weightValue = detailEditWeight.value;
          const response = await fetch(`/api/inspections/${encodeURIComponent(currentInspection.inspection_id)}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              product_id: detailEditProduct.value,
              inspected_at: datetimeValue ? `${datetimeValue.replace('T', ' ')}${datetimeValue.length === 16 ? ':00' : ''}` : '',
              weight_g: weightValue === '' ? null : Number(weightValue),
            }),
          });
          const result = await response.json();
          if (!response.ok || result.error) throw new Error(result.error || '저장하지 못했습니다.');
          await renderInspectionDetail(currentInspection.inspection_id);
        } catch (error) {
          detailEditError.textContent = error.message || '저장하지 못했습니다.';
          detailEditError.hidden = false;
        } finally {
          detailEditSave.disabled = false;
        }
      });

      inspectionSubmitButton.addEventListener('click', async () => {
        inspectionSubmitError.hidden = true;
        inspectionSubmitButton.disabled = true;
        try {
          if (!inspectionPhotos.files.length) {
            inspectionSubmitError.textContent = '사진을 골라 주세요.';
            inspectionSubmitError.hidden = false;
            return;
          }

          const images = await Promise.all(Array.from(inspectionPhotos.files, readFileAsDataUrl));
          const weightValue = inspectionWeight.value;
          const payload = {
            product_id: inspectionProduct.value,
            inspected_at: formatApiDateTime(inspectionDatetime.value),
            revision: inspectionRevision.value,
            weight_g: weightValue === '' ? null : Number(weightValue),
            memo: inspectionMemo.value,
            images,
          };
          const response = await fetch('/api/inspections', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result.error || '검사를 등록하지 못했습니다.');
          }
          navigate(`/inspections/${encodeURIComponent(result.inspection_id)}`);
        } catch (error) {
          inspectionSubmitError.textContent = error.message || '검사를 등록하지 못했습니다.';
          inspectionSubmitError.hidden = false;
        } finally {
          inspectionSubmitButton.disabled = false;
        }
      });

      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;
        try {
          const response = await fetch('/api/logout', { method: 'POST' });
          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result.error || '로그아웃하지 못했습니다.');
          }

          loginForm.reset();
          loginError.textContent = '';
          loginError.hidden = true;
          headerUser.textContent = '';
          headerActions.hidden = true;
          yellowNotice.hidden = true;
          appFooter.hidden = true;
          appScreen.hidden = true;
          loginBox.hidden = false;
        } catch (error) {
          showLoginError(error.message || '로그아웃하지 못했습니다.');
          loginBox.hidden = false;
        } finally {
          logoutButton.disabled = false;
        }
      });

      window.addEventListener('popstate', renderScreen);

      checkLogin();
    </script>
  </body>
</html>
